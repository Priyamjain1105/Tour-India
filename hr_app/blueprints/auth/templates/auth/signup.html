{% extends "base.html" %}

{% block title %}Sign Up — Kataria TalentFlow{% endblock %}

{% block content %}
<div
    class="min-h-[calc(100vh-4rem)] bg-slate-50/50 flex items-center justify-center p-4 sm:p-6 font-sans antialiased bg-[linear-gradient(to_right,#e2e8f0_1px,transparent_1px),linear-gradient(to_bottom,#e2e8f0_1px,transparent_1px)] bg-[size:4rem_4rem]">
    <div class="w-full max-w-md mx-auto">

        <div
            class="p-6 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:border-kataria-100 transition duration-200">

            <div class="flex items-center gap-3 mb-6 pb-6 border-b border-slate-100">
                <div
                    class="bg-kataria-600 text-white w-9 h-9 rounded-lg flex items-center justify-center shadow-sm shrink-0">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 2a2 2 0 100 4 2 2 0 000-4zm-1.5 6a1.5 1.5 0 00-1.5 1.5V14a1 1 0 001 1h1v6a1 1 0 002 0v-6h1a1 1 0 001-1V9.5A1.5 1.5 0 0013.5 8h-3z" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 tracking-tight text-lg leading-snug">Create Account</h1>
                    <p class="text-xs text-slate-500">Register as a new employee</p>
                </div>
            </div>

            <form action="{{ url_for('auth.signup') }}" method="POST" class="space-y-4" id="signupForm">

                <div>
                    <label for="company_code" class="block text-xs font-semibold text-slate-700 mb-1.5">Company
                        Passcode</label>
                    <input type="password" id="company_code" name="company_code"
                        placeholder="Enter registration passcode" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                </div>

                <div>
                    <label for="full_name" class="block text-xs font-semibold text-slate-700 mb-1.5">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="e.g. John Doe" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                </div>

                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a unique username" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                </div>

                <div>
                    <label for="confirm_password" class="block text-xs font-semibold text-slate-700 mb-1.5">Confirm
                        Password</label>
                    <input type="password" id="confirm_password" placeholder="••••••••" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                    <p id="passwordError"
                        class="text-red-500 text-[11px] font-semibold tracking-tight mt-1.5 hidden flex items-center gap-1">
                        <svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                                clip-rule="evenodd" />
                        </svg>
                        Passwords do not match
                    </p>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-slate-900 hover:bg-kataria-600 text-white px-5 py-2.5 rounded-lg font-semibold text-xs transition-colors duration-200 shadow-sm active:scale-[0.98]">
                        Create Account
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    Already registered?
                    <a href="{{ url_for('auth.login') }}"
                        class="font-semibold text-kataria-600 hover:underline transition ml-1">
                        Log In
                    </a>
                </p>
            </div>

        </div>

    </div>
</div>

<script>
    const form = document.getElementById("signupForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm_password");
    const errorMsg = document.getElementById("passwordError");

    form.addEventListener("submit", function (e) {
        if (password.value !== confirmPassword.value) {
            e.preventDefault();
            errorMsg.classList.remove("hidden");
            confirmPassword.classList.add("border-red-500", "focus:border-red-500", "focus:ring-red-500");
            confirmPassword.classList.remove("border-slate-200", "focus:border-kataria-600", "focus:ring-kataria-600");
        } else {
            errorMsg.classList.add("hidden");
            confirmPassword.classList.remove("border-red-500", "focus:border-red-500", "focus:ring-red-500");
            confirmPassword.classList.add("border-slate-200");
        }
    });
</script>
{% endblock %}
