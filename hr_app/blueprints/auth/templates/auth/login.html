{% extends "base.html" %}

{% block title %}Log In — Kataria TalentFlow{% endblock %}

{% block content %}
<div
    class="min-h-[calc(100vh-4rem)] bg-slate-50/50 flex items-center justify-center p-4 sm:p-6 font-sans antialiased bg-[linear-gradient(to_right,#e2e8f0_1px,transparent_1px),linear-gradient(to_bottom,#e2e8f0_1px,transparent_1px)] bg-[size:4rem_4rem]">
    <div class="w-full max-w-md mx-auto">

        <div
            class="p-6 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:border-kataria-100 transition duration-200">

            <div class="flex items-center gap-3 mb-6 pb-6 border-b border-slate-100">
                <div
                    class="bg-kataria-600 text-white w-9 h-9 rounded-lg flex items-center justify-center shadow-sm shrink-0">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 2a2 2 0 100 4 2 2 0 000-4zm-1.5 6a1.5 1.5 0 00-1.5 1.5V14a1 1 0 001 1h1v6a1 1 0 002 0v-6h1a1 1 0 001-1V9.5A1.5 1.5 0 0013.5 8h-3z" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 tracking-tight text-lg leading-snug">Welcome Back</h1>
                    <p class="text-xs text-slate-500">Sign in to your Employee Account</p>
                </div>
            </div>

            <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-slate-900 text-xs placeholder:text-slate-400 focus:outline-none focus:border-kataria-600 focus:ring-1 focus:ring-kataria-600 transition">
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-slate-900 hover:bg-kataria-600 text-white px-5 py-2.5 rounded-lg font-semibold text-xs transition-colors duration-200 shadow-sm active:scale-[0.98]">
                        Log In
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    Don't have an account?
                    <a href="{{ url_for('auth.signup') }}"
                        class="font-semibold text-kataria-600 hover:text-kataria-700 hover:underline transition">
                        Create Employee Account
                    </a>
                </p>
            </div>

        </div>

    </div>
</div>
{% endblock %}
